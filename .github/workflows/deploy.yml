# Deploy do backend na EC2 a cada push na main (ou manual em Actions > Run workflow).
#
# Como funciona:
#   1. build da imagem no runner do GitHub
#   2. push da imagem para o Docker Hub  (usuario/api-avaliacoes:latest)
#   3. na EC2 (via SSH): docker pull + docker run
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  seu usuário do Docker Hub
#   DOCKERHUB_TOKEN     token do Docker Hub (Account settings > Personal access tokens, Read & Write)
#   EC2_HOST            IP da máquina (ex.: 13.220.42.157)
#   EC2_SSH_KEY         conteúdo INTEIRO do arquivo .pem
#   AUTH0_DOMAIN        ex.: dev-xxxx.us.auth0.com
#   AUTH0_AUDIENCE      ex.: https://avaliacoes-api
#   EC2_USER            (opcional, padrão: ubuntu)

name: Deploy backend na AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

# ⭐ Nome da imagem no Docker Hub, nome do container e portas (docker run -p 8080:8000)
env:
  IMAGE_NAME: api-avaliacoes
  CONTAINER: api
  PORTA_EXTERNA: "8080"
  PORTA_INTERNA: "8000"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Conferir secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          faltando=""
          for nome in DOCKERHUB_USERNAME DOCKERHUB_TOKEN EC2_HOST EC2_SSH_KEY AUTH0_DOMAIN AUTH0_AUDIENCE; do
            [ -z "${!nome}" ] && faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then echo "::error::Secrets faltando:$faltando"; exit 1; fi
          # Nome completo da imagem: usuario/api-avaliacoes:latest
          echo "IMAGE=$DOCKERHUB_USERNAME/$IMAGE_NAME:latest" >> "$GITHUB_ENV"

      - name: Login no Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build da imagem
        run: docker build -t "$IMAGE" .

      - name: Push para o Docker Hub
        run: docker push "$IMAGE"

      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/ec2.pem
            StrictHostKeyChecking no
            ServerAliveInterval 30
          EOF

      - name: Pull e run na EC2
        run: |
          ssh ec2 bash -s <<EOF
            set -e
            # login só para o pull (funciona mesmo se o repositório no Docker Hub for privado)
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull $IMAGE
            docker logout

            docker rm -f $CONTAINER 2>/dev/null || true
            docker run -d --name $CONTAINER --restart unless-stopped \
              -p $PORTA_EXTERNA:$PORTA_INTERNA \
              -v api-data:/data \
              -e AUTH0_DOMAIN="$AUTH0_DOMAIN" \
              -e AUTH0_AUDIENCE="$AUTH0_AUDIENCE" \
              $IMAGE
            docker image prune -f
          EOF

      - name: Verificar se a API subiu
        run: |
          ssh ec2 bash -s <<EOF
            for i in \$(seq 1 20); do
              if curl -fsS http://localhost:$PORTA_EXTERNA/health; then
                echo; echo "API no ar: http://$EC2_HOST:$PORTA_EXTERNA/docs"; exit 0
              fi
              sleep 2
            done
            echo "A API não respondeu. Logs do container:"
            docker logs --tail 80 $CONTAINER
            exit 1
          EOF

# Deploy automático (mesmo modelo do professor): Maven -> imagem no Docker Hub -> SSH na EC2 -> docker run
#
# Secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_TOKEN            token do Docker Hub (Read & Write)
#   HOST_TEST  (ou EC2_HOST)   IP da EC2
#   KEY_TEST   (ou EC2_SSH_KEY) conteúdo inteiro do .pem
#   AUTH0_DOMAIN               ex.: dev-xxxx.us.auth0.com
#   AUTH0_AUDIENCE             ex.: https://avaliacoes-api

name: Deploy automatico

on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]          # mudar só o README não faz deploy
  workflow_dispatch:
    inputs:
      apagar_banco:
        description: "Apagar o banco (todas as tabelas) antes de subir"
        type: boolean
        default: false

# O workflow só precisa ler o código
permissions:
  contents: read

# ⭐ Mude para o seu usuário do Docker Hub
env:
  DOCKER_IMAGE: nadertaha06/api-avaliacoes
  CONTAINER_NAME: api
  DOCKER_USER: nadertaha06

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          IMAGEM: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DOCKER_USER: ${{ env.DOCKER_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          APAGAR_BANCO: ${{ inputs.apagar_banco || false }}
        with:
          host: ${{ secrets.HOST_TEST || secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST || secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGEM,CONTAINER_NAME,DOCKER_USER,DOCKERHUB_TOKEN,AUTH0_DOMAIN,AUTH0_AUDIENCE,APAGAR_BANCO
          script: |
            set -e

            # 1) Rede e Postgres (só cria na primeira vez; os dados ficam no volume postgres-data)
            docker network create -d bridge rede 2>/dev/null || true
            if [ -z "$(docker ps -aq -f name=^postgres-aula$)" ]; then
              docker run -d --name postgres-aula --restart unless-stopped \
                -e POSTGRES_DB=auladb -e POSTGRES_USER=usuario -e POSTGRES_PASSWORD=senha \
                -v postgres-data:/var/lib/postgresql/data \
                --network=rede postgres:17
            fi
            docker start postgres-aula > /dev/null
            until docker exec postgres-aula pg_isready -U usuario -d auladb > /dev/null 2>&1; do sleep 1; done

            # 2) Opcional (Run workflow > "Apagar o banco"): apaga todas as tabelas
            if [ "$APAGAR_BANCO" = "true" ]; then
              echo "Apagando o banco..."
              docker exec postgres-aula psql -U usuario -d auladb -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
            fi

            # 3) Baixa a imagem nova e sobe a API
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin
            docker pull $IMAGEM
            docker logout

            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 8080:8000 \
              -e DB_HOST=postgres-aula \
              -e AUTH0_DOMAIN="$AUTH0_DOMAIN" \
              -e AUTH0_AUDIENCE="$AUTH0_AUDIENCE" \
              --network=rede \
              $IMAGEM

            docker image prune -f

            # 4) Confere se subiu: sem token a API responde 401 (= está no ar e protegida)
            for i in $(seq 1 60); do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
              if [ "$codigo" = "401" ]; then
                echo "API no ar em http://localhost:8080"
                exit 0
              fi
              sleep 2
            done
            echo "A API não respondeu. Logs do container:"
            docker logs --tail 100 $CONTAINER_NAME
            exit 1

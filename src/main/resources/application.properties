# A prova pede docker run -p 8080:8000, então a API escuta na 8000 dentro do container
server.port=8000

# Rodando local, lê o arquivo .env (copie o .env.example). No Docker as variáveis vêm do docker run -e
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/auladb
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Coloca a mensagem do erro no JSON (o front mostra em vermelho)
spring.web.error.include-message=always

# ⭐ Auth0: AUTH0_DOMAIN (ex.: dev-xxxx.us.auth0.com) e AUTH0_AUDIENCE (ex.: https://avaliacoes-api)
# vêm dos secrets do GitHub. Também pode colocar o valor fixo aqui, como o professor faz.
# Atenção: o certo é "audiences" (com s). Com "audience" o Spring ignora e não confere a audience.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}
